name: prices
on:
  schedule:
    - cron: "37 20 * * 1-5"   # 16:37 EDT (15:37 EST: before the close, keeps the previous day)
    - cron: "37 21 * * 1-5"   # 17:37 EDT / 16:37 EST
    - cron: "7 23 * * 1-5"    # backup
    - cron: "13 12 * * 2-6"   # next-morning backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prices.yml", "fetch_prices.py", "tickers.txt", "brief_config.json"]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas lxml
      - run: python fetch_prices.py 2>&1 | tee run_log.txt
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          FILES="latest.json market.json brief_tables.md tables sp500.csv ndx.csv run_log.txt thermo_history.csv screen_log.csv screen_returns.md screen_returns.json"
          stage() { for f in $FILES; do [ -e "$f" ] && git add "$f"; done; }
          stage
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push && exit 0
            # another run (scheduled or dispatched) pushed first: put our fresh outputs on top of its commit
            tmp=$(mktemp -d); for f in $FILES; do [ -e "$f" ] && cp -r "$f" "$tmp/"; done
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r "$tmp"/. . && stage
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
