name: prices
on:
  schedule:
    - cron: "37 20 * * 1-5"   # 16:37 EDT (15:37 EST: before the close, keeps the previous day)
    - cron: "37 21 * * 1-5"   # 17:37 EDT / 16:37 EST
    - cron: "7 23 * * 1-5"    # backup
    - cron: "13 12 * * 2-6"   # next-morning backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prices.yml", "fetch_prices.py", "tickers.txt", "brief_config.json"]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas lxml
      - run: python fetch_prices.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add latest.json market.json brief_tables.md tables sp500.csv ndx.csv 2>/dev/null || git add latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
